name: Verificar atualizações da CAPES

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda-feira, 06h (Brasília)
  workflow_dispatch: {}     # também pode ser executado manualmente

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pandas openpyxl
      - name: Verifica a CAPES e atualiza os dados se houver novidade
        run: python etl/atualizar.py
        continue-on-error: false
      - name: Publica os dados atualizados
        run: |
          git config user.name "painel-pg-bot"
          git config user.email "painel-pg-bot@users.noreply.github.com"
          git add site/data etl/estado.json
          git diff --cached --quiet || git commit -m "Atualiza dados da CAPES (verificação automática)"
          git push
